name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-macos:
    name: Universal macOS app
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Intel and Apple silicon
        run: ./build.sh
      - name: Test color tools and persistence
        run: ./scripts/test.sh
      - name: Verify and package
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PrismDrop-universal
          path: dist/*
          if-no-files-found: error

name: Import source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed PrismDrop source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          task_tmp=$(mktemp -d)
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern 'PrismDrop-1.0.0-source.zip' --dir "$task_tmp"
          cd "$task_tmp"
          echo '6d7f77e98a70bf1d8f8e91d92f1a23e1daa3a18d40cfc5f944ab6e98870ee852  PrismDrop-1.0.0-source.zip' | sha256sum -c -
          unzip -q PrismDrop-1.0.0-source.zip
          rsync -a --exclude='.github/' PrismDrop/ "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          git config user.name 'Aaryan Kumar'
          git config user.email '120643172+deadpoods@users.noreply.github.com'
          git add .
          git commit -m 'Publish PrismDrop source, glass prism icon, and documentation'
          git push origin HEAD:main
